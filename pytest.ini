[pytest]
testpaths = tests
# project root on sys.path so `import src...` works
pythonpath = .
addopts = -q
# the parametrized case ids are Russian text; keep them readable instead of ф...
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = true
# tmp_path directories go away with the session instead of being kept for three runs —
# same intent as the state directory tests/conftest.py removes at exit: a green
# `make test` leaves only an empty `pytest-of-$USER` behind in the temp dir ($TMPDIR on
# macOS, not /tmp), because the basetemp inside it is removed once the run ends with
# exitstatus 0 and no --basetemp was passed. `failed` rather than `none` so that a
# failing test KEEPS its directory for the post-mortem: tests/storage/* put their sqlite
# databases there and tests/rates/* the rates cache with its temp files, and `none` would
# delete the only evidence a red run produced.
tmp_path_retention_policy = failed
